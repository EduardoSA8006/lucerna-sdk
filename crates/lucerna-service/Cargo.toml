[package]
name = "lucerna-service"
description = "Esqueleto do serviço de um app do Lucerna: ativação pelo systemd, saída por ociosidade, o servidor do protocolo e a conexão ao shell."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# FakeShell e FakeScheduler, para os testes dos apps.
testing = []

[dependencies]
lucerna-ipc.workspace = true
lucerna-paths.workspace = true
lucerna-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Os testes deste crate usam o módulo `testing`.
lucerna-service = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
